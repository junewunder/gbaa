# agb/native-serial for 600 frames with no input: the serial registers'
# program of the native lifter's check (native/hw-serial-registers; `just
# lift-check`), its lift (gbaa-lift) against the play build at --timing
# native by route-check --native. What it draws: agb/native-serial/SCENE.md.
rom = "$GBAA_DATA/agb/native-serial.gba"

[[checkpoint]]
name = "native-serial-600"
frame = 600
hash = "56d84929d20fa3ae"
mgba_hash = "8d45278efae3c410"
mgba_why = "Kept on purpose (native/serial-no-partner-as-mgba): mGBA 0.10.5 stores every bit of JOYCNT and JOYSTAT outside JOY bus mode, where GBATEK gives them flags only a partner sets; its unused halfwords read open bus, 0 in the whole I/O block here; and a byte store to SIOCNT merges with its unanswered copy"
# Our interpreter at --timing exact (`just unit`, 2026-11-14).
# Known mGBA mismatch: mGBA 0.10.5 draws 8d45278efae3c410. With nothing
# plugged in, the play build's serial port answers as mGBA's
# (`runtime::io::Io::sio_unplugged`, from src/gba/sio.c and io.c): SI set
# in normal mode, an internal-clock transfer ended in the store with its
# IRQ, multiplayer's bits 2-6 forced, RCNT's low four bits never stored,
# 0x15A no register. What is left, kept on purpose:
# - JOYCNT and JOYSTAT: mGBA stores all 16 bits outside JOY bus mode; the
#   play build keeps GBATEK's bits in every mode (JOYCNT bit 6, its flags
#   0-2 only a partner sets; JOYSTAT bits 4-5, bit 3 set by a JOY_TRANS
#   store, bit 1 only a partner's).
# - The unused halfwords (0x12C, 0x12E, 0x138-0x13E, 0x144-0x14E, 0x15C,
#   0x15E) read open bus in mGBA (and on hardware), 0 here, as every
#   unused I/O halfword does in the play build and the lift.
# - A byte store to SIOCNT: mGBA merges it with what was last stored there
#   (`memory.io`), not with the register as its dummy driver answered, so
#   a high-byte store after an ended transfer starts it again (another
#   IRQ). The play build merges with the register, as the hardware has
#   one.
# Built with those left out of the pixel (JOYCNT, JOYSTAT and the unused
# halfwords masked in `colour`) and without the frame's `strb` to SIOCNT's
# high byte, the program draws the same in mGBA and our interpreter on
# every frame from 2 to 600 (frame 1 differs in any build: start-up);
# with the strb back, SIOCNT and the IRQ count differ from frame 21
# (2026-11-14).
