[package]
name = "jt-check"
version.workspace = true
edition.workspace = true
publish = false

# The jump-table check (decision 5c): truth tables from a pret ELF and the
# ROM, and a score of `analysis::jumptable` against them. A separate crate
# so `object` stays out of `analysis`.

[dependencies]
analysis = { path = "../analysis" }
armv4t = { path = "../armv4t" }
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
