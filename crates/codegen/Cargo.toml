[package]
name = "codegen"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
runtime = { path = "../runtime" }
analysis = { path = "../analysis" }
armv4t = { path = "../armv4t" }
fn-diff = { path = "../fn-diff" }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
toml = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
