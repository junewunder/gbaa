# The lift check (`just lift-check`; units native/lift-stage-a, native/lift-bars;
# docs/native-stage-b.md, "How every piece is checked"), read by gbaa-lift-check
# and by `gbaa-lift --bars`.
#
# One table per program. The key is the ROM's file stem, lower case (gbaa-lift's
# name for it; its stand-ins are holes/<key>.toml if there is one).
#   rom            the ROM, under $GBAA_DATA (`just agb-tests` builds them)
#   route          what `route-check --native` runs the lift and its play build on
#   lift_flags     more gbaa-lift flags (optional)
#   route_flags    more route-check flags (optional)
#   planted_store  a store the lift makes wrong (`--plant`); the native check must catch it
#   planted_hole   a stand-in the lift drops (`--drop-standin`); the lift and its crate's
#                  build must fail, the build with an error containing `names`
#   planted_flags  gbaa-lift flags that each bring an old behaviour back, one lift per
#                  flag; the native check must catch each (`route-check --planted`)
#
# [program.<key>.bars]: each metric of the lift's report.txt at most its bar.
# Bars are maxima, set at the values measured when the program was added, and
# only lowered: a unit's check names the bar it lowers and to what. Raising one
# to make a check pass is changing the oracle: ask june (`just ask`). The one
# exception is lines_prelude, the hand-written prelude every lift starts with
# (crates/codegen/src/native/prelude.rs): it may rise when a unit adds to the
# prelude, the unit's evidence saying how many lines and why. lines is the rest
# of what the lift writes (the lifted code and the stand-ins), and only goes down.
# functions_recognised has no bar (it should rise); every other metric needs one.
# Metric names: crates/codegen/src/native/metrics.rs.

