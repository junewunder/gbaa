route = "units/native-irq-hold-601.toml"
# Stage A's old IRQs (native/lift-irq-hold): ih_probe polls VCOUNT past
# line 160 inside a critical section (the CPSR's I bit set), and the old
# lift runs the V-blank handler at that wait, where the hardware holds it
# until ih_restore's msr clears I.
planted_flags = ["--irq-at-waits"]

