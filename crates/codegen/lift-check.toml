# Stack slots printed as Rust locals (native/frame-locals): fl_keep keeps
# three values in non-escaping slots across a call and returns them, and
# the main loop stores the result to a global. The planted control makes
# the local store of `x + 7` (`str r1, [sp, #4]`) store one more; the
# native check skips the guest stack, so only the global and the picture
# can show it.
planted_flags = ["--plant-slot=0x08000182"]

