# The lift check (`just lift-check`; units native/lift-stage-a, native/lift-bars;
# docs/native-stage-b.md, "How every piece is checked"), read by gbaa-lift-check
# and by `gbaa-lift --bars`.
#
# One table per program. The key is the ROM's file stem, lower case (gbaa-lift's
# name for it; its stand-ins are holes/<key>.toml if there is one).
#   rom            the ROM, under $GBAA_DATA (`just agb-tests` builds them)
#   route          what `route-check --native` runs the lift and its play build on
#   lift_flags     more gbaa-lift flags (optional)
#   route_flags    more route-check flags (optional)
#   planted_store  a store the lift makes wrong (`--plant`); the native check must catch it
#   planted_hole   a stand-in the lift drops (`--drop-standin`); the lift and its crate's
#                  build must fail, the build with an error containing `names`
#   planted_flags  gbaa-lift flags that each bring an old behaviour back, one lift per
#                  flag; the native check must catch each (`route-check --planted`)
#
# [program.<key>.bars]: each metric of the lift's report.txt at most its bar.
# Bars are maxima, set at the values measured when the program was added; a
# unit's check names the bar it lowers and to what. They measure how plain the
# lift is, not whether it is right: hard_holes and the planted controls never
# loosen without june (`just ask`). A unit may raise any other bar itself when
# the native check stays green and its evidence gives the bar, its old and new
# value, and the cause (docs/native-stage-b.md has the rule). lines_prelude is
# the hand-written prelude (crates/codegen/src/native/prelude.rs); lines is the
# rest of what the lift writes (not the modules' wiring, native/modules.rs).
# functions_recognised has no bar (it should rise); every other metric needs one.
# Metric names: crates/codegen/src/native/metrics.rs.
# entries_beyond_one on the C rows raised 2026-11-19 (native/lift-one-entry merged
# with native/lift-typed-access): their new names files name every function,
# and a named function keeps its x_ body below its named entry, for a stop's
# backtrace (native/named.rs): c-chain 2/5 -> 15, c-fnptr 9/10 -> 27, c-switch
# 2 -> 12; the native check stays green.
# locals_noted (native/lift-local-names) is barred on the C rows only, the
# programs whose names files give DWARF variables: the variables left a
# comment because liveness or their type didn't agree with a name.
# c-fnptr-agbcc's raised 8 -> 10 (native/lift-frame-gone merged with
# native/lift-local-names): with the saves gone, add_callback's r4 and
# cb_spawn's r0 aren't printed, so no rename takes their variable; a note does.
# lines_prelude raised 1327 -> 1328 (native/mirror-native-route, merged after
# native/lift-gives' 1322 -> 1327; 1322 -> 1323 on its branch): st8 passes a
# byte store to a sound or timer register on as a byte (hw::write_io8), as the
# play build's bus, not its pair rewritten (Amazing Mirror's PSG differed).
# lines_prelude raised 1454 -> 1482 (native/lift-restore-saved-block):
# resume, Resumed and resumed, a restore of a saved block's jump by unwinding
# into the frame that saved it.
# lines_prelude raised 1337 -> 1364 (native/lift-longjmp): restore,
# catch_restore and restored, a context restore's return by unwinding into
# the caller of its save (setjmp's). native-ram-jump's, added beside it, was
# left at 1337 until native/moonbeam-builds.
# lines_prelude raised 1364 -> 1373 (native/land-emerald-route-lifter, from
# native/emerald-native-route): ROM loads read the cartridge's GPIO port
# (rom_half) and halfword ROM stores reach it, with Hw::gpio set from the ROM,
# as the play build's bus: Emerald's RTC probe failed in the lift (rtc.c's
# sErrorStatus 0x90 from frame 10).
# lines_prelude raised 1373 -> 1390 (native/lift-pointer-types): Ref's
# Clone, Copy and addr move into the prelude from the names files' part
# (prelude_fields.rs), so a heap run's Ref<T> can be a variable's type too.
# ref_to_at_use (native/lift-field-base): the typed pointers still made at a
# use from one into their object, `Ref::<T>::to(…)`, at the values measured
# once a register holding a field's address prints on its base's register
# (field_bases, no bar), or on a constant's: c-loops' three went (two a
# for's stepped pointer, one c-loops-agbcc's gRow + 2).
# ref_new_at_use (native/lift-pointer-types): the typed pointers still made at
# a use, `Ref::<T>::new(…)` or `::to(…)`, at the values measured once a
# pointer variable is declared the Ref<T> its accesses make of it (after
# native/lift-for-index and native/lift-stack-arrays merged).
# lines raised on eight C rows by the parameters it binds, one line each
# (`let n: Ref<t::Node> = Ref::new(n);`, till signatures take the type:
# native/lift-pointer-signatures): c-fnptr-gcc 633 -> 634, c-switch-gcc 644 -> 645, c-chain-gcc 631 -> 632, c-heap-gcc 705 -> 706, c-bits-agbcc 439 -> 442, c-bits-gcc 495 -> 498, c-list-agbcc 596 -> 597, c-list-gcc 665 -> 666.
# lines raised on 26 rows by 1 to 10 (native/lift-pointer-registers):
# a register local typed Ref<T> takes its own line out of the entries'
# tuple `let` (`let mut pData: Ref<t::SamusData> = Ref::new(0u32);`), and
# ref_new_at_use lowered on thirty with it.
# native-copy-takes (native/lift-takes-across-copies) given results_several
# and tuple_calls (native/lift-returns-read, merged beside it), and its
# lines, value_lets, reg_local_writes and loops_not_for lowered to what
# the two together lift.
# lines_prelude raised 1328 -> 1337 (native/fnref-dense): call_fn and irq_entry
# take a dense function's ID (`DENSE`, empty at --fn-ids rom). fn_keys_left
# (native/fnref-dense): the function words and code constants a --fn-ids dense
# build leaves as keys, at the values measured; 0 on the C programs but
# c-fnptr-gcc, whose callback words a frame's pushed r3 holds in the stacks'
# cell (an indirect call's callee assumed to read the caller's frame).
# proto_shapes_refused (native/lift-signature-holes): the functions whose
# names-file prototype the summaries prove wrong, which keep the summaries'
# shape (c-fnptr-gcc and c-loops-gcc: 2 each, GCC's push of r3 to keep the
# stack 8-byte aligned reads it as a parameter). entries_beyond_one raised
# by 1-3 on eight C rows with it: a function shaped from its prototype that
# is called through a pointer gets an adapter (a_), as summary-shaped ones
# do; the native check stays green. c-fnptr-gcc's lines 633 -> 634 with it
# (AgbMain's adapter).
# rom_static_fn_keys and rom_refs (native/rom-statics), at the values
# measured: the function words the flow read in a ROM static that a dense
# build leaves as keys (agb's 3 in a byte static, read a byte at a time), and
# the loads from a word static that holds a pointer into ROM data (a RomRef's
# soft hole).
# lines_prelude raised 1390 -> 1454 (native/lift-lent-print; native-copy-takes, merged beside it, too): Lent, a
# pointer to a caller's stack local lent to a callee, with its accesses and
# the bounds check that names the function. c-chain-gcc's casts raised
# 49 -> 51 with it: frame's ctx is a host local, its two u16 fields read
# back `as u32`; its lines, value_lets, load_sp and load_computed_unknown
# fall (bounce's and draw_body's accesses through ctx, no rotates).
# loops_not_for lowered by native/lift-for-top-tested on the agb rows (2-5
# each: a latch leaving by a guarded exit before an unguarded jump back is
# a for too) and c-jump-agbcc (7 -> 6); for_counter_arith raised on affine
# (0 -> 1) and mosaic-modes (1 -> 2), the new for's body scaling its counter;
# lines, value_lets and reg_local_writes lowered to the values measured.

