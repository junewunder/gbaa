# The lift check (`just lift-check`; units native/lift-stage-a, native/lift-bars;
# docs/native-stage-b.md, "How every piece is checked"), read by gbaa-lift-check
# and by `gbaa-lift --bars`.
#
# One table per program. The key is the ROM's file stem, lower case (gbaa-lift's
# name for it; its stand-ins are holes/<key>.toml if there is one).
#   rom            the ROM, under $GBAA_DATA (`just agb-tests` builds them)
#   route          what `route-check --native` runs the lift and its play build on
#   lift_flags     more gbaa-lift flags (optional)
#   route_flags    more route-check flags (optional)
#   planted_store  a store the lift makes wrong (`--plant`); the native check must catch it
#   planted_hole   a stand-in the lift drops (`--drop-standin`); the lift and its crate's
#                  build must fail, the build with an error containing `names`
#   planted_flags  gbaa-lift flags that each bring an old behaviour back, one lift per
#                  flag; the native check must catch each (`route-check --planted`)
#
# [program.<key>.bars]: each metric of the lift's report.txt at most its bar.
# Bars are maxima, set at the values measured when the program was added; a
# unit's check names the bar it lowers and to what. They measure how plain the
# lift is, not whether it is right: hard_holes and the planted controls never
# loosen without june (`just ask`). A unit may raise any other bar itself when
# the native check stays green and its evidence gives the bar, its old and new
# value, and the cause (docs/native-stage-b.md has the rule). lines_prelude is
# the hand-written prelude (crates/codegen/src/native/prelude.rs); lines is the
# rest of what the lift writes (not the modules' wiring, native/modules.rs).
# functions_recognised has no bar (it should rise); every other metric needs one.
# Metric names: crates/codegen/src/native/metrics.rs.
# entries_beyond_one on the C rows raised 2026-11-19 (native/lift-one-entry merged
# with native/lift-typed-access): their new names files name every function,
# and a named function keeps its x_ body below its named entry, for a stop's
# backtrace (native/named.rs): c-chain 2/5 -> 15, c-fnptr 9/10 -> 27, c-switch
# 2 -> 12; the native check stays green.
# locals_noted (native/lift-local-names) is barred on the C rows only, the
# programs whose names files give DWARF variables: the variables left a
# comment because liveness or their type didn't agree with a name.
# c-fnptr-agbcc's raised 8 -> 10 (native/lift-frame-gone merged with
# native/lift-local-names): with the saves gone, add_callback's r4 and
# cb_spawn's r0 aren't printed, so no rename takes their variable; a note does.

