[package]
name = "ui-egui"
version = "0.0.0"
edition = "2024"
publish = false

# Not part of the gbaa workspace: a throwaway spike (docs/research/ui-library.md).
[workspace]

[dependencies]
winit = "0.30"
gilrs = "0.11"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
egui_glow = { version = "0.37", features = ["winit"] }
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"

[profile.release]
strip = true
