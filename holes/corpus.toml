# The hole report's corpus (`just holes-all`; `gbaa-holes --corpus`,
# crates/hole-report/src/corpus.rs): the nine games the ranking in
# docs/research/native-holes.md is over, in its order.
#   name    the short name: the report is DIR/<name>.txt, `--only NAME` picks it
#   rom     the ROM's file name in the ROM directory (the justfile's `roms`)
#   cover   its coverage runs (holes/coverage/), played with `holes-all --cover`
#   lift    the --name its lift is made with (`just lift`, `just nightly`): it
#           names the crate and finds the holes file (holes/<lift>.toml, else
#           mods/<lift>/holes.toml)

[[game]]
name = "metroid"
rom = "Metroid - Zero Mission (USA).gba"
cover = "holes/coverage/metroid-zero-mission.toml"
lift = "metroid"

