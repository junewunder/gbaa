# The stage-A lift's holes for agb/native-irq-hold (`just lift`, crates/codegen/src/native.rs):
# hand-written stand-ins for the functions the lifter can't print, each
# with why: agb 0.25's own code, the same in every agb program but for its
# addresses (`nm agb/native-irq-hold.elf`), then the program's own critical
# section, ih_disable and ih_restore.

[[standin]]
entry = 0x0800259c
why = "portable_atomic's interrupt::disable (ARM): `mrs r0, cpsr; orr r1, r0, #0x80; msr cpsr_c, r1`, a critical section's start. The program's CPSR is Game::cpsr; while its I bit is set the waits hold IRQs (Native::irq_masked)"
code = '''
pub fn f_0800259c(g: &mut Game, sp: u32, a: [u32; 4]) -> Result<[u32; 4], Exit> {
    let r0 = g.cpsr;
    g.cpsr = r0 | 0x80;
    Ok([r0, r0 | 0x80, a[2], a[3]])
}
'''

[[standin]]
entry = 0x080025b8
why = "portable_atomic's interrupt::restore (ARM): `msr cpsr_c, r0`, a critical section's end: clearing I runs the IRQs it held (msr_cpsr_c)"
code = '''
pub fn f_080025b8(g: &mut Game, sp: u32, a: [u32; 4]) -> Result<[u32; 4], Exit> {
    msr_cpsr_c(g, sp, a[0]);
    Ok(a)
}
'''

[[standin]]
entry = 0x03000000
why = "agb's InterruptHandler (interrupt_handler.s, ARM, in IWRAM): the IRQ wrapper, which switches to system mode around its call with msr. Its I/O and RAM effects as written; the call runs on the stack the program waited on (Game::sp), as system mode's banked sp would. Game::cpsr stays as the IRQ entry set it, IRQ mode with I set, where the wrapper's msr runs the call in system mode with I clear: IME is off there, so no IRQ could be taken either way"
code = '''
pub fn f_03000000(g: &mut Game, sp: u32, a: [u32; 4]) -> Result<[u32; 4], Exit> {
    // ldr r3, [0x0400_0200]: IE and IF; r0 = what's enabled and requested.
    let ie_if = ld32(g, 0x0400_0200);
    let due = ie_if & (ie_if >> 16);
    st16(g, 0x0400_0200, ie_if & !due); // IE without them
    st16(g, 0x0400_0202, due); // IF: acknowledged
    let f = ld16(g, 0x0300_7FF8); // the BIOS's flags, for IntrWait
    st16(g, 0x0300_7FF8, f | due);
    let ime = ld32(g, 0x0400_0208); // swp: IME off
    st32(g, 0x0400_0208, 0);
    // System mode: `push {lr}`, then __RUST_INTERRUPT_HANDLER(due).
    f_080025fd(g, g.sp.wrapping_sub(4), [due, 0x080025fd, ime, ie_if])?;
    st32(g, 0x0400_0208, 0x0400_0000); // IME's low half 0
    st32(g, 0x0400_0208, ime); // IME as it was
    st16(g, 0x0400_0200, ie_if); // IE as it was
    Ok([0x0400_0000, a[1], ime, ie_if])
}
'''


[[standin]]
entry = 0x080001c8
why = "the program's own ih_disable (ARM, agb/native-irq-hold's global_asm!): `mrs r0, cpsr; orr r1, r0, #0x80; msr cpsr_c, r1`, as portable_atomic's interrupt::disable: the critical section's start"
code = '''
pub fn f_080001c8(g: &mut Game, sp: u32, a: [u32; 4]) -> Result<[u32; 4], Exit> {
    let r0 = g.cpsr;
    g.cpsr = r0 | 0x80;
    Ok([r0, r0 | 0x80, a[2], a[3]])
}
'''

[[standin]]
entry = 0x080001d8
why = "the program's own ih_restore (ARM): `msr cpsr_c, r0`, the critical section's end: clearing I runs the V-blank IRQ it held (msr_cpsr_c)"
code = '''
pub fn f_080001d8(g: &mut Game, sp: u32, a: [u32; 4]) -> Result<[u32; 4], Exit> {
    msr_cpsr_c(g, sp, a[0]);
    Ok(a)
}
'''
