# Structs, unions and enums by C name (a typedef's for an anonymous one):
# fields with byte offset, size, type and bitfield bits [lowest, width].

[types."struct Bar"]
kind = "struct"
size = 8
fields = [
  { name = "len", off = 0, size = 2, type = "u16" },
  { name = "hue", off = 2, size = 1, type = "u8" },
  { name = "pad", off = 3, size = 1, type = "u8" },
  { name = "dx", off = 4, size = 2, type = "s16" },
  { name = "dy", off = 6, size = 2, type = "s16" },
]

[types."struct Pocket"]
kind = "struct"
size = 8
fields = [
  { name = "slots", off = 0, size = 4, type = "struct Slot *" },
  { name = "cap", off = 4, size = 1, type = "u8" },
]

[types."struct Row"]
kind = "struct"
size = 26
fields = [
  { name = "count", off = 0, size = 1, type = "u8" },
  { name = "hue", off = 1, size = 1, type = "u8" },
  { name = "len", off = 2, size = 24, type = "u16 [12]" },
]

[types."struct Slot"]
kind = "struct"
size = 4
fields = [
  { name = "id", off = 0, size = 2, type = "u16" },
  { name = "qty", off = 2, size = 2, type = "u16" },
]

# #define families of pret's include/constants/ that a field takes, by
# the prefix its name spells (`optionsTextSpeed`: OPTIONS_TEXT_SPEED_*),
# and enums a field or global takes by its type (`GameMode`):
# each value's one name, the fields, as `type.field`, the globals,
# and the parameters pret's calls pass them to, as `function:index`.

[values."NUM"]
file = "main.c"
fields = []
args = ["first_long:0", "move_bars:0", "sum_movers:1"]
names = [
  { name = "NUM_BARS", value = 12 },
  { name = "NUM_MOVERS", value = 6 },
]
