# #define families of pret's include/constants/ that a field takes, by
# the prefix its name spells (`optionsTextSpeed`: OPTIONS_TEXT_SPEED_*),
# and enums a field or global takes by its type (`GameMode`):
# each value's one name, the fields, as `type.field`, and the globals.
