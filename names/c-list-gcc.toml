# Structs, unions and enums by C name (a typedef's for an anonymous one):
# fields with byte offset, size, type and bitfield bits [lowest, width].

[types."struct List"]
kind = "struct"
size = 8
fields = [
  { name = "head", off = 0, size = 4, type = "struct Node *" },
  { name = "count", off = 4, size = 4, type = "u32" },
]

[types."struct Node"]
kind = "struct"
size = 20
fields = [
  { name = "next", off = 0, size = 4, type = "struct Node *" },
  { name = "act", off = 4, size = 4, type = "void (*)(struct Node *)" },
  { name = "x", off = 8, size = 2, type = "s16" },
  { name = "y", off = 10, size = 2, type = "s16" },
  { name = "dx", off = 12, size = 2, type = "s16" },
  { name = "dy", off = 14, size = 2, type = "s16" },
  { name = "color", off = 16, size = 2, type = "u16" },
  { name = "life", off = 18, size = 1, type = "u8" },
  { name = "size", off = 19, size = 1, type = "u8" },
]

