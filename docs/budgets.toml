# Line budgets for the docs every session reads (crates/leak-check,
# src/budgets.rs; `just check` fails a doc over its budget). A plan doc
# keeps the plan: a unit's measured numbers go in the doc's generated
# numbers file (`*.numbers.md`) or the unit's tracker evidence, not the
# doc. Raising a budget is fine with a reason: say it in a comment here.
#   path       from the repo root
#   max_lines  the most lines it may have

# The stage-B plan, cut from 810 lines to a plan on 2026-11-06.
[[doc]]
path = "docs/native-stage-b.md"
max_lines = 400

